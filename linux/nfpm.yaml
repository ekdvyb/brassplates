name: brassplates
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: BRASSPLATES
description: BRASSPLATES - local-first notes and to-do app
vendor: BRASSPLATES
homepage: https://github.com/ekdvyb/brassplates
license: Proprietary
overrides:
  deb:
    depends:
      - libgtk-3-0 | libgtk-3-0t64
      - libayatana-appindicator3-1 | libayatana-appindicator3-1t64
  rpm:
    depends:
      - gtk3
      - libayatana-appindicator-gtk3
contents:
  - src: build/linux/x64/release/bundle
    dst: /opt/brassplates
  - src: linux/brassplates.desktop
    dst: /usr/share/applications/brassplates.desktop
  - src: assets/icons/app_icon.png
    dst: /usr/share/icons/hicolor/512x512/apps/brassplates.png
  - src: /opt/brassplates/brassplates
    dst: /usr/bin/brassplates
    type: symlink
