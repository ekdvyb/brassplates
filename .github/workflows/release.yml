name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev libsecret-1-dev

      - name: Build Linux bundle
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package DEB and RPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          sed "s/\${VERSION}/$VERSION/" linux/nfpm.yaml > nfpm.yaml
          nfpm package --config nfpm.yaml --packager deb --target dist/
          nfpm package --config nfpm.yaml --packager rpm --target dist/
          cd dist
          for f in *; do
            case "$f" in
              *.deb) mv "$f" "BrassPlates-$VERSION-amd64.deb" ;;
              *.rpm) mv "$f" "BrassPlates-$VERSION-x86_64.rpm" ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          cp build/app/outputs/flutter-apk/app-release.apk "BrassPlates-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: BrassPlates-*.apk
          if-no-files-found: error

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows bundle
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          $version = ((Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' }) -replace 'version:\s*', '').Split('+')[0]
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "BrassPlates-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: BrassPlates-*-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: BRASSPLATES ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
